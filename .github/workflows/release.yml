name: build-and-release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: trupx-windows-x64.exe
            bin: trupx.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: trupx-linux-x64
            bin: trupx
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            name: trupx-linux-aarch64
            bin: trupx
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            name: trupx-darwin-x64
            bin: trupx
          - target: aarch64-apple-darwin
            os: macos-14
            name: trupx-darwin-aarch64
            bin: trupx
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross linker (aarch64-linux-gnu)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: build
        working-directory: terminal
        run: cargo build --release --target ${{ matrix.target }}

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "terminal/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list artifacts
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          files: dist/*
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
