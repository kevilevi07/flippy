[package]
name = "flippy"
version = "0.1.0"
edition = "2021"
authors = ["shashti.s@finstein.ai"]
description = "Flippy - a lightweight web terminal with a built-in self-hosted tunnel"
license = "MIT"

[[bin]]
name = "flippy"
path = "src/main.rs"

[dependencies]
# Core / async
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
futures-util = "0.3"

# Terminal server
axum = { version = "0.7", features = ["ws"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
portable-pty = "0.8"

# Tunnel client
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "url"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "dns-over-https-rustls", "webpki-roots"] }
url = "2"

# Serialization / CLI / config
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"

# Local helpers
subtle = "2"
rand = "0.8"
sysinfo = "0.32"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
